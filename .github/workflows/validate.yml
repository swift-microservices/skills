name: Validate

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash .github/scripts/validate.sh
