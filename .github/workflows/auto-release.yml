name: Auto Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-release
  cancel-in-progress: false

jobs:
  auto-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate skills and manifests
        run: bash .github/scripts/validate.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/create-release.sh
