name: PR label

permissions:
  contents: read
  # The label checker reads the pull request's labels, which a private repository's token cannot
  # see without this.
  pull-requests: read

on:
  pull_request:
    types: [labeled, unlabeled, opened, reopened, synchronize]

jobs:
  semver-label-check:
    name: Semantic version label check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check for Semantic Version label
        uses: apple/swift-nio/.github/actions/pull_request_semver_label_checker@6db9d9abd92ad7399b8a564cafbb87d3507245fa  # 2.104.0
