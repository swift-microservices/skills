name: Clean up container images

permissions:
  contents: read

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  cleanup:
    name: Clean up
    permissions:
      packages: write
    uses: swift-microservices/ci/.github/workflows/cleanup-images.yml@cd121186f68dc9749d11578df6f8c73a22319383  # 0.1.0
    with:
      package_name: example-service
