name: Service checks

on:
  workflow_call:
    inputs:
      service_product:
        type: string
        required: true

permissions:
  contents: read

jobs:
  soundness:
    name: Source quality
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@9a10bfdc569159a3463f1273fbd7ed5f97fbe598  # 0.0.15
    with:
      api_breakage_check_enabled: false
      docs_check_enabled: false
      license_header_check_enabled: true
      format_check_container_image: swift:6.3-noble

  workflow-lint:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install verified actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate workflows and embedded shell
        run: '"$RUNNER_TEMP/actionlint" -color'

  tests:
    name: Tests and static SDK
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@9a10bfdc569159a3463f1273fbd7ed5f97fbe598  # 0.0.15
    with:
      linux_swift_versions: '["6.3"]'
      linux_os_versions: '["noble"]'
      linux_host_archs: '["aarch64"]'
      linux_build_command: swift test --disable-automatic-resolution
      swift_flags: >-
        -Xswiftc -warnings-as-errors
        --explicit-target-dependency-import-check error
        -Xswiftc -require-explicit-sendable
      enable_linux_static_sdk_build: true
      linux_static_sdk_versions: '["6.3"]'
      linux_static_sdk_build_command: >-
        swift build --configuration release --disable-automatic-resolution
        --product ${{ inputs.service_product }}
      enable_macos_checks: false
      enable_ios_checks: false
      enable_windows_checks: false
