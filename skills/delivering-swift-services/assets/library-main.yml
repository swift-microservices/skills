name: Main

permissions:
  contents: read

on:
  push:
    branches: [main]

jobs:
  tests:
    name: Tests
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@3137ed1a48293ae9f4312fce349ed6210251db89  # 0.0.16
    with:
      # Swift 6.3 is the floor: swiftlang's default versions, minus those below it.
      linux_exclude_swift_versions: '[{"swift_version": "6.1"}, {"swift_version": "6.2"}]'
      linux_os_versions: '["noble"]'
      linux_build_command: swift test -c release
      swift_flags: "-Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable"
      swift_nightly_flags: "--explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable"
      enable_windows_checks: false

  foundation-linking:
    name: Foundation linking
    uses: vapor/ci/.github/workflows/check-foundation-linking.yml@aa94dc533dba802a4df05327d755bc9077f0a8d7  # main
    with:
      swift_image: swift:6.3-noble
