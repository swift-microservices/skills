name: Tests

# The unit-test matrix from apple/swift-nio cannot attach a database, so this package runs its
# tests in its own matrix with a Postgres service container beside each toolchain.

permissions:
  contents: read

on:
  workflow_call:

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "6.3 Noble"
            image: "swift:6.3-noble"
            arguments: "-Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable"
          - name: "6.4 Resolute"
            image: "swift:6.4-resolute"
            arguments: "-Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable"
          - name: "nightly-next Noble"
            image: "swiftlang/swift:nightly-6.4.x-noble"
            arguments: "--explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable"
          - name: "nightly-main Noble"
            image: "swiftlang/swift:nightly-main-noble"
            arguments: "--explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable"
    container:
      image: ${{ matrix.image }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Run tests
        run: swift test --parallel ${{ matrix.arguments }}
