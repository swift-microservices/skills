name: Tests

# swiftlang's swift_package_test cannot attach a database, so the package runs its tests in this
# matrix, the same toolchains and flags as the standard tests job, beside a PostgreSQL service.

permissions:
  contents: read

on:
  workflow_call:

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "6.3 Noble"
            image: "swift:6.3-noble"
            arguments: "-Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable"
          - name: "6.4 Noble"
            image: "swift:6.4-noble"
            arguments: "-Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable"
          - name: "nightly-next Noble"
            image: "swiftlang/swift:nightly-6.4.x-noble"
            arguments: "--explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable"
          - name: "nightly-main Noble"
            image: "swiftlang/swift:nightly-main-noble"
            arguments: "--explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable"
    container:
      image: ${{ matrix.image }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        run: swift test -c release --parallel ${{ matrix.arguments }}
