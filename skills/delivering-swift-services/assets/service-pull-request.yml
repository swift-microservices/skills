name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      service_product: example-service

  image:
    name: Release image
    uses: ./.github/workflows/image.yml
    with:
      service_product: example-service
      image_repository: ghcr.io/example/example-service
