name: Main

permissions:
  contents: read

on:
  push:
    branches: [main]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@3137ed1a48293ae9f4312fce349ed6210251db89  # 0.0.16
    with:
      api_breakage_check_enabled: false
      docs_check_enabled: false
      license_header_check_enabled: true
      format_check_container_image: swift:6.3-noble

  tests:
    name: Tests
    # With private dependencies, call swift-microservices/ci/.github/workflows/tests.yml@<commit> instead: the same inputs, plus
    # `secrets: PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}`.
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@3137ed1a48293ae9f4312fce349ed6210251db89  # 0.0.16
    with:
      linux_swift_versions: '["6.3"]'
      linux_os_versions: '["noble"]'
      linux_host_archs: '["aarch64"]'
      linux_build_command: swift test --disable-automatic-resolution
      swift_flags: >-
        -Xswiftc -warnings-as-errors
        --explicit-target-dependency-import-check error
        -Xswiftc -require-explicit-sendable
      enable_windows_checks: false

  publish:
    name: Publish image
    needs: [soundness, tests]
    permissions:
      contents: read
      packages: write
    uses: swift-microservices/ci/.github/workflows/build-image.yml@cd121186f68dc9749d11578df6f8c73a22319383  # 0.1.0
    with:
      service_product: example-service
      image_repository: ghcr.io/example/example-service
      # build_target: example-service  # only when the image is not the Containerfile's last stage
      publish: true
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  staging:
    name: Staging
    needs: [publish]
    permissions:
      contents: read
      actions: read
      packages: read
    uses: swift-microservices/ci/.github/workflows/deploy.yml@cd121186f68dc9749d11578df6f8c73a22319383  # 0.1.0
    with:
      environment: staging
      image_repository: ghcr.io/example/example-service
      # Deploy order: the application that migrates first, then its worker, if any.
      application_ids: '["<staging service application id>", "<staging worker application id>"]'
    secrets:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
